version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]
      prod:
        dependency-type: production
        update-types: [minor, patch]
