<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axel Roubaud — Développeur full stack</title>
    <meta
      name="description"
      content="Développeur full stack à Marseille, en alternance chez Viaxoft et en Mastère à l'Esimed. Je construis des applications web de bout en bout : l'interface, l'API et la base de données."
    />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Axel Roubaud — Développeur full stack" />
    <meta
      property="og:description"
      content="Mon parcours, ma stack et les projets que j'ai menés, du site en ligne au travail d'école."
    />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('cv-theme')
          var isDark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
